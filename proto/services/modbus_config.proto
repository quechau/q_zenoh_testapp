// modbus_config.proto — `modbus.config` READ/WRITE schema (contracts doc 05 §B4.3).
//
// Carried inside RequestEnvelope.payload / ResponseEnvelope.payload.
// READ  -> ModbusConfig (full middleware-owned snapshot on the device)
// WRITE -> ModbusConfigDelta in, ConfigResult out (per-item atomic verdicts).

syntax = "proto3";

package ce.embedded.modbus.v1;

// Shared with the other config planes: the per-item WRITE verdict, and (for the
// polled planes) the cadence class. Only what is specific to this protocol is
// declared below.
import "common/config.proto";

// ---------------------------------------------------------------------------
// Definitions
// ---------------------------------------------------------------------------

enum ModbusInterface {
  IF_UNSPECIFIED = 0;
  IF_RS485_1     = 1;
  IF_RS485_2     = 2;
  IF_LORA        = 3;
}

// Serial parity for a device's RTU framing. Word length is fixed at 8 and stop
// bits at 1 (Modbus RTU norm); only baud and parity vary in practice, so those
// are the two knobs carried per device.
enum Parity {
  PAR_UNSPECIFIED = 0;  // treated as PAR_NONE by the device
  PAR_NONE        = 1;
  PAR_EVEN        = 2;
  PAR_ODD         = 3;
}

enum RegisterType {
  REG_UNSPECIFIED = 0;
  REG_COIL        = 1;
  REG_DISCRETE    = 2;
  REG_INPUT       = 3;
  REG_HOLDING     = 4;
}

enum DataType {
  DT_UNSPECIFIED = 0;
  DT_U16         = 1;
  DT_I16         = 2;
  DT_U32         = 3;
  DT_I32         = 4;
  DT_F32         = 5;
  DT_BIT         = 6;
}

message ModbusDeviceDef {
  uint32          device_id = 1;   // middleware-owned id (reserved range on device)
  uint32          unit_id   = 2;   // Modbus slave address 1..247 (wiresheet-selectable)
  ModbusInterface interface = 3;
  bool            enabled   = 4;
  // Per-device serial line rate. The device applies baud+parity to the port
  // before each transaction with this slave (skipped when already current), so
  // slaves at different baud can share one RS485 bus, time-multiplexed. 0 = keep
  // the port's boot default (param 0x0250/0x0251).
  uint32          baud      = 5;   // e.g. 9600, 19200, 38400, 57600, 115200
  Parity          parity    = 6;
}

message ModbusPointDef {
  uint32       point_id   = 1;
  uint32       device_ref = 2;     // ModbusDeviceDef.device_id
  RegisterType reg_type   = 3;
  uint32       address    = 4;     // 0..65535
  DataType     data_type  = 5;
  float        scale      = 6;     // engineering = raw * scale (0 forbidden)
  bool         writable   = 7;
  ce.embedded.common.v1.PollClass    poll_class = 8;

  // Operator-facing display name (the wiresheet component's name, e.g.
  // "target-temp"). Host-owned and purely descriptive: the board never parses
  // it — it stores the string and hands it back in the config READ snapshot so
  // a consumer that is not the wiresheet (the phone) can label points the way
  // the operator does. Empty is legal (older hosts); consumers must fall back
  // to the point id. Bounded small (.options) because it rides the same
  // 512 B delta / 1536 B snapshot caps as everything else.
  string       name       = 9;

  // --- Per-point failsafe (contract 0.4.1, ADR-025 / customer-confirmed A-1) ---
  // "If no AUTHENTICATED host request reaches the board for `failsafe_timeout_s`
  // seconds, drive this point to `failsafe_value`." The retained fragment of the
  // flow engine's responsibility: configuration, not deployment. The host keeps
  // the timer honest by sending a periodic authenticated keepalive (an ordinary
  // points READ), so a quiet-but-healthy link never false-triggers. Re-auth +
  // re-assert (FR-CTRL-003) restores the desired value afterwards.
  // Only meaningful on writable points; the board ignores it elsewhere.
  // timeout_s < 30 with enable = true is invalid (rejected REJ_INVALID): the
  // timeout MUST exceed the host keepalive period (20 s) with margin, or a
  // quiet-but-healthy link false-triggers between two keepalives (measured).
  // Recommended starting point: 60 s (~6x the measured recovery time, TC-42).
  bool   failsafe_enable    = 10;
  float  failsafe_value     = 11;
  uint32 failsafe_timeout_s = 12;
}

// ---------------------------------------------------------------------------
// READ response — full snapshot of middleware-owned config on the device.
// ---------------------------------------------------------------------------

message ModbusConfig {
  repeated ModbusDeviceDef devices = 1;   // bounded via .options
  repeated ModbusPointDef  points  = 2;

  // Fingerprint of the config this device has stored, so a host can ask "are you
  // still holding what I last sent you?" without diffing the snapshot field by
  // field — a comparison that two independent implementations get subtly wrong.
  //
  // OPAQUE to consumers. Compare it for equality against a value read from THIS
  // device earlier; never recompute it, never parse it, never compare it across
  // devices. The construction (first 8 bytes of the SHA-256 over the canonical
  // encoding of `devices` + `points` with this field empty, lowercase hex) is the
  // device's business and may change without a contract bump. Only the equality
  // contract is normative:
  //
  //   same value  ⇒ the stored config has not changed since it was last read
  //   differs     ⇒ it has changed, or the device restarted without it
  //
  // "Canonical" carries the weight here: entries are ordered by id before
  // hashing, so a device that reloads its config from storage after a reboot
  // reports the value it reported before, even though its internal slot order
  // may differ. Without that the fingerprint would change on every boot and be
  // worse than useless — it would say "changed" when nothing had.
  //
  // Empty ⇒ this device does not implement config persistence. A host MUST then
  // fall back to pushing unconditionally; an absent fingerprint is never treated
  // as "unchanged". (proto3 omits defaults, so old devices are exactly this case.)
  string config_hash = 3;
}

// ---------------------------------------------------------------------------
// WRITE request/response — delta-only, per-item atomic (no replaceAll by design).
// ---------------------------------------------------------------------------

message ModbusConfigDelta {
  repeated ModbusDeviceDef upsert_devices   = 1;
  repeated ModbusPointDef  upsert_points    = 2;
  repeated uint32          remove_device_ids = 3;
  repeated uint32          remove_point_ids  = 4;

  // --- Sync-prune (contract 0.4.3) ---
  // A remove sent while the device is unreachable is lost forever: the host
  // forgets the entry, the device keeps it, and no later delta ever mentions
  // that id again. Three bench incidents grew from exactly this (POOL_FULL
  // from zombie devices; zombie points firing failsafe long after deletion),
  // each ending in a manual NVS wipe. Prune closes the gap by making the
  // host's full reconciliation sync AUTHORITATIVE about what may exist.
  //
  // Semantics: when `prune` is true, the device — AFTER applying this delta's
  // upserts and removes — removes every middleware-owned device whose id is
  // not in `keep_device_ids` and every point whose id is not in
  // `keep_point_ids`. The lists are the host's complete desired id sets for
  // this plane, so `prune = true` with empty lists means "remove everything".
  // The host sends prune only as the FINAL chunk of a full sync (after the
  // upsert chunks it just pushed — their ids are therefore always kept), never
  // on an incremental delta.
  //
  // Pruned ids are NOT echoed in ConfigResult (applied_ids is capped and the
  // prune already succeeded if the RPC succeeded); the device logs one line
  // per pruned entry instead. A pre-0.4.3 device simply ignores these fields —
  // the sync still applies, only the pruning is skipped, which is exactly the
  // old behaviour.
  repeated uint32 keep_device_ids = 5;
  repeated uint32 keep_point_ids  = 6;
  bool            prune           = 7;
}

// The WRITE verdict is shared with every other config plane — see
// common/config.proto (ConfigResult / ConfigResultItem / ConfigReject).
// The per-plane meaning of a rejection (a "duplicate" here is a unit id on an
// interface, or a point id) is documented with ConfigReject in common/config.proto.
